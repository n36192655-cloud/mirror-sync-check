<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ميزان — وضع الأوفلاين</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Cairo, system-ui, sans-serif;
        background: #fcfbf8;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 30rem; }
      h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
      p { color: #475569; font-size: 0.9rem; line-height: 1.8; }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0f172a;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        هذه الصفحة غير محفوظة على الجهاز. الصفحات التي فتحتها سابقاً — ومنها صفحة القراءات — تعمل
        بدون إنترنت، وأي قراءة أو صورة تسجّلها محفوظة على الجهاز وتُرسل تلقائياً عند عودة الشبكة.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
